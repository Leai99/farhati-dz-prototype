<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Home-screen install (icon/name/theme only — no service worker or offline support by design).
         Colors match tokens.ts: theme = primary-pink, background = cream-base. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D92166" />
    <!-- iOS Safari ignores manifest icons: dedicated opaque 180x180 icon + standalone tags -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Farhati DZ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فرحتي دي زد — Farhati DZ</title>

    <!-- Google Fonts: IBM Plex Sans Arabic (Arabic) + Inter (Latin) — see Section 4 of the spec -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
